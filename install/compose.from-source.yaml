# Project NOMAD — stack a partir do código-fonte deste repositório
#
# Uso (na raiz do repo):
#   cp .env.example .env   # edite URL / segredos / NOMAD_DATA_DIR
#   bash install/up_from_source.sh
#
# Este arquivo faz build local do admin + sidecars. Para usar as imagens
# oficiais do GHCR sem build, use install/management_compose.yaml (via install_nomad.sh).
name: project-nomad

services:
  admin:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
    image: project-nomad:local
    pull_policy: never
    container_name: nomad_admin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ${NOMAD_DATA_DIR:-/opt/project-nomad}/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - nomad-update-shared:/app/update-shared
    environment:
      - NODE_ENV=production
      - NOMAD_STORAGE_PATH=${NOMAD_DATA_DIR:-/opt/project-nomad}/storage
      - PORT=8080
      - LOG_LEVEL=info
      - APP_KEY=${APP_KEY}
      - HOST=0.0.0.0
      - URL=${URL}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=nomad
      - DB_USER=nomad_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=nomad
      - DB_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DISABLE_COMPRESSION=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dozzle:
    image: amir20/dozzle:v10.0
    container_name: nomad_dozzle
    restart: unless-stopped
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_ENABLE_ACTIONS=false
      - DOZZLE_ENABLE_SHELL=false

  mysql:
    image: mysql:8.0
    container_name: nomad_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nomad
      - MYSQL_USER=nomad_user
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${NOMAD_DATA_DIR:-/opt/project-nomad}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    restart: unless-stopped
    volumes:
      - ${NOMAD_DATA_DIR:-/opt/project-nomad}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  updater:
    build:
      context: ./sidecar-updater
      dockerfile: Dockerfile
    image: project-nomad-sidecar-updater:local
    pull_policy: never
    container_name: nomad_updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NOMAD_DATA_DIR:-/opt/project-nomad}:${NOMAD_DATA_DIR:-/opt/project-nomad}
      - nomad-update-shared:/shared

  disk-collector:
    build:
      context: ./sidecar-disk-collector
      dockerfile: Dockerfile
    image: project-nomad-disk-collector:local
    pull_policy: never
    container_name: nomad_disk_collector
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
      - ${NOMAD_DATA_DIR:-/opt/project-nomad}/storage:/storage

volumes:
  nomad-update-shared:
    driver: local
